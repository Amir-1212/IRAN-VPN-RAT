name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Get Version
        id: ver
        shell: bash
        run: |
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ KEYSTORE_BASE64 secret نیست یا خالیه"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          test -s release.jks
          echo "✅ keystore decode شد ($(stat -c%s release.jks) bytes)"
          chmod 600 release.jks

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          DEVICE_NAME: ${{ secrets.DEVICE_NAME }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}

      - name: Verify APK Signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "❌ APK ساخته نشد: $APK"
            echo "محتوای پوشه:"
            find app/build/outputs/apk -type f 2>/dev/null || echo "پوشه apk وجود نداره"
            exit 1
          fi
          echo "✅ APK ساخته شد ($(stat -c%s "$APK") bytes)"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "استفاده از build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Build ${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
