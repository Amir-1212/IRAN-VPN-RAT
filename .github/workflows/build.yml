name: Build & Release APK
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Setup Android SDK (only platform-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Get version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
            V_CODE=$(git rev-list --count HEAD)
          else
            V_CODE=$(date +%s)
            V_NAME=$(date +%Y.%m.%d.%H%M)
          fi
          echo "code=$V_CODE" >> $GITHUB_OUTPUT
          echo "name=$V_NAME" >> $GITHUB_OUTPUT
      - name: Build APK
        run: gradle assembleDebug --no-daemon
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          DEVICE_NAME: ${{ secrets.DEVICE_NAME }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Build ${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          make_latest: true
